# Casos de referencia de ejemplo sobre la biblioteca estándar. Edítalos o crea los tuyos.
#
# Requisito (basta con una de las dos fuentes, cada caso acepta ambas):
#   - API:   uv run api index json pathlib asyncio shutil subprocess collections re
#   - Docs:  zip de texto de docs.python.org en la carpeta de docs (`api config`)  ->  api index-docs
# Uso:        uv run api eval evals/stdlib.toml            (-v para ver todos los casos)
#
# `expected` admite nombres exactos, patrones con `*` y alternativas con `|`:
#   "json.dumps|library/json.txt#*"  ->  la API indexada o cualquier trozo de su página.
# Cada pregunta debería tener una fuente que la responda sin ambigüedad, salvo las de
# `expected = []` (sin respuesta: al final del fichero).

# --- Nombre cualificado en la pregunta ---------------------------------------------

[[case]]
category = "exacto"
question = "¿Cómo uso json.dumps con indentación?"
expected = ["json.dumps|library/json.txt#*"]

[[case]]
category = "exacto"
question = "¿Qué parámetros tiene asyncio.gather?"
expected = ["asyncio.gather|library/asyncio-task.txt#*"]

[[case]]
category = "exacto"
question = "¿Cómo funciona subprocess.run?"
expected = ["subprocess.run|library/subprocess.txt#*"]

[[case]]
category = "exacto"
question = "¿Qué hace shutil.copytree?"
expected = ["shutil.copytree|library/shutil.txt#*"]

# --- Clase.método sin el módulo ----------------------------------------------------

[[case]]
category = "cualificado-parcial"
question = "¿Qué devuelve Path.rglob?"
expected = ["pathlib.Path.rglob|library/pathlib.txt#*"]

[[case]]
category = "cualificado-parcial"
question = "¿Cómo se usa Counter.most_common?"
expected = ["collections.Counter.most_common|library/collections.txt#*"]

# --- Atributos y métodos heredados -------------------------------------------------
# `suffix` vive en una base privada de pathlib (PurePathBase en 3.13) y `name`/`joinpath`
# en PurePath: Path los hereda. Miden que lo heredado sigue siendo encontrable.

[[case]]
category = "atributos"
question = "¿Qué devuelve la propiedad Path.suffix?"
expected = ["pathlib.PurePath.suffix|pathlib.Path.suffix|library/pathlib.txt#*"]

[[case]]
category = "atributos"
question = "¿Cómo obtengo solo el nombre del fichero de un Path?"
expected = ["pathlib.PurePath.name|pathlib.Path.name|library/pathlib.txt#*"]

[[case]]
category = "heredados"
question = "¿Para qué sirve Path.joinpath?"
expected = ["pathlib.PurePath.joinpath|pathlib.Path.joinpath|library/pathlib.txt#*"]

